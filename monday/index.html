<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あと何回、月曜日が来るか</title>
<meta name="description" content="定年まで、あと何回の月曜日が残っているかを数えます。">
<style>
:root{
  --bg:#12151A;
  --fg:#EDEFF2;
  --dim:#7C8592;
  --line:#262B33;
  --hi:#E8873A;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--gothic);font-size:16px;line-height:1.8;
  font-feature-settings:"palt" 1;min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:0 20px 90px}

h1{
  font-family:var(--mincho);font-weight:400;
  font-size:clamp(26px,7.5vw,38px);letter-spacing:.04em;
  margin:52px 0 0;line-height:1.4;
}
.lede{color:var(--dim);font-size:14px;margin:12px 0 0}

.form{margin:30px 0 0;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.two{display:flex;gap:14px;flex-wrap:wrap}
.f{flex:1 1 150px;min-width:0;margin-bottom:14px}
input,select{
  width:100%;font-family:var(--gothic);font-size:16px;color:var(--fg);
  background:transparent;border:1px solid var(--line);
  padding:11px 12px;border-radius:0;
}
input:focus,select:focus{outline:2px solid var(--hi);outline-offset:1px;border-color:var(--hi)}
select option{background:var(--bg);color:var(--fg)}
button{
  width:100%;font-family:var(--gothic);font-size:16px;
  padding:14px;border:1px solid var(--hi);background:var(--hi);color:var(--bg);
  cursor:pointer;border-radius:0;margin-top:4px;
}
button:hover{background:transparent;color:var(--hi)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

#out{display:none;margin-top:44px}

.hero{text-align:center;padding:8px 0 28px;border-bottom:1px solid var(--line)}
.hero .k{font-size:14px;color:var(--dim);letter-spacing:.1em}
.hero .v{
  font-family:var(--mincho);font-variant-numeric:tabular-nums;
  font-size:clamp(64px,21vw,116px);line-height:1;color:var(--hi);
  margin:10px 0 6px;letter-spacing:-.01em;
}
.hero .u{font-size:15px;color:var(--dim)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-top:1px}
.cell{background:var(--bg);padding:20px 16px}
.cell .k{font-size:12.5px;color:var(--dim);line-height:1.5}
.cell .v{
  font-family:var(--mincho);font-variant-numeric:tabular-nums;
  font-size:clamp(26px,7.5vw,34px);line-height:1.15;margin-top:6px;
}
.cell .v small{font-size:.42em;color:var(--dim);margin-left:.3em;font-family:var(--gothic)}

.tail{margin-top:34px;font-family:var(--mincho);font-size:17px;line-height:1.9;color:var(--fg)}
.tail span{color:var(--hi)}

footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.85}
</style>
</head>
<body>
<div class="wrap">

  <h1>あと何回、月曜日が来るか</h1>
  <p class="lede">定年までに残っている月曜日の回数を数えます。それだけです。</p>

  <div class="form">
    <div class="two">
      <div class="f">
        <label for="bd">生年月日</label>
        <input type="date" id="bd">
      </div>
      <div class="f">
        <label for="ret">定年</label>
        <select id="ret">
          <option value="60">60歳</option>
          <option value="65" selected>65歳</option>
          <option value="70">70歳</option>
          <option value="75">75歳</option>
        </select>
      </div>
    </div>
    <button id="go">数える</button>
  </div>

  <div id="out">
    <div class="hero">
      <div class="k">残りの月曜日</div>
      <div class="v" id="mon">0</div>
      <div class="u">回</div>
    </div>

    <div class="grid">
      <div class="cell"><div class="k">残りの出勤日<br>（概算）</div><div class="v" id="work">0<small>日</small></div></div>
      <div class="cell"><div class="k">残りの給料日</div><div class="v" id="pay">0<small>回</small></div></div>
      <div class="cell"><div class="k">残りの日曜の夜</div><div class="v" id="sun">0<small>回</small></div></div>
      <div class="cell"><div class="k">残りの年末年始</div><div class="v" id="ny">0<small>回</small></div></div>
      <div class="cell"><div class="k">残りの夏</div><div class="v" id="sum">0<small>回</small></div></div>
      <div class="cell"><div class="k">残りの桜</div><div class="v" id="sak">0<small>回</small></div></div>
    </div>

    <p class="tail" id="tail"></p>
  </div>

  <footer>
    <p>祝日は考慮していません。出勤日は年間240日として概算しています。定年後のことは数えていません。</p>
    <p>1KB</p>
  </footer>
</div>

<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };

  function countWeekday(from, to, wd){
    var days = Math.floor((to - from) / 86400000);
    if(days <= 0) return 0;
    var full = Math.floor(days / 7);
    var n = full;
    var rest = days - full * 7;
    var d = new Date(from.getTime() + full * 7 * 86400000);
    for(var i=0;i<rest;i++){
      d.setDate(d.getDate() + 1);
      if(d.getDay() === wd) n++;
    }
    var s = new Date(from.getTime());
    for(var j=0;j<Math.min(7, days);j++){
      if(s.getDay() === wd){ break; }
      s.setDate(s.getDate() + 1);
    }
    return n;
  }

  function countMonthDay(from, to, month, day){
    var n = 0;
    for(var y = from.getFullYear(); y <= to.getFullYear(); y++){
      var t = new Date(y, month - 1, day);
      if(t > from && t <= to) n++;
    }
    return n;
  }

  function num(n){ return Math.max(0, Math.round(n)).toLocaleString("ja-JP"); }

  $("go").addEventListener("click", function(){
    var v = $("bd").value;
    if(!v){ alert("生年月日を入れてください。"); return; }
    var bd = new Date(v + "T00:00:00");
    if(isNaN(bd.getTime())){ alert("日付を確認してください。"); return; }

    var age = parseInt($("ret").value, 10);
    var end = new Date(bd.getFullYear() + age, bd.getMonth(), bd.getDate());
    var now = new Date();
    now.setHours(0,0,0,0);

    if(end <= now){
      $("out").style.display = "block";
      $("mon").textContent = "0";
      ["work","pay","sun","ny","sum","sak"].forEach(function(i){ $(i).innerHTML = "0<small>回</small>"; });
      $("tail").innerHTML = "もう来ません。<span>おつかれさまでした。</span>";
      $("out").scrollIntoView({behavior:"smooth", block:"start"});
      return;
    }

    var days = Math.floor((end - now) / 86400000);
    var years = days / 365.25;

    var mon = countWeekday(now, end, 1);
    var sun = countWeekday(now, end, 0);
    var work = Math.round(years * 240);
    var pay = Math.round(years * 12);
    var ny = countMonthDay(now, end, 1, 1);
    var sum = countMonthDay(now, end, 8, 1);
    var sak = countMonthDay(now, end, 4, 1);

    $("mon").textContent = num(mon);
    $("work").innerHTML = num(work) + "<small>日</small>";
    $("pay").innerHTML  = num(pay) + "<small>回</small>";
    $("sun").innerHTML  = num(sun) + "<small>回</small>";
    $("ny").innerHTML   = num(ny) + "<small>回</small>";
    $("sum").innerHTML  = num(sum) + "<small>回</small>";
    $("sak").innerHTML  = num(sak) + "<small>回</small>";

    var msgs = [
      "残り<span>" + num(sak) + "</span>回の桜は、多いですか。少ないですか。",
      "月曜日は<span>" + num(mon) + "</span>回。1回くらい、休んでもいいと思います。",
      "あと<span>" + num(pay) + "</span>回、給料日が来ます。",
      "日曜の夜が<span>" + num(sun) + "</span>回残っています。"
    ];
    $("tail").innerHTML = msgs[Math.floor(Math.random() * msgs.length)];

    $("out").style.display = "block";
    $("out").scrollIntoView({behavior:"smooth", block:"start"});
  });
})();
</script>
</body>
</html>
